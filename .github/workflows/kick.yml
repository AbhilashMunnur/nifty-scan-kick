name: Kick Nifty IST slots

# Public repo so these waits stay on free public Actions minutes.
# GitHub schedule here is only a morning starter; the job then self-chains
# on the scan grid until 15:40 IST, then overnight until the next 09:30.
# Tue/Thu every 15 min including 15:10 and 15:15. Mon/Wed/Fri every 30 min.
on:
  workflow_dispatch:
  repository_dispatch:
    types: [nifty-kick]
  schedule:
    # 08:50–09:05 IST (03:20–03:35 UTC) weekdays
    - cron: "20,25,30,35 3 * * 1-5"
    # 09:20–09:38 IST (03:50–04:08 UTC)
    - cron: "50,55 3 * * 1-5"
    - cron: "0,2,5,8 4 * * 1-5"
    # Hourly backup during the session
    - cron: "0 5-10 * * 1-5"

concurrency:
  group: nifty-slot-kick
  cancel-in-progress: true

jobs:
  kick:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TZ: Asia/Kolkata
      GH_TOKEN: ${{ secrets.NIFTY_DISPATCH_TOKEN }}
      TARGET_REPO: AbhilashMunnur/nifty-index-scan
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Wait for slot, dispatch Nifty, chain
        run: python3 -u kick.py
